<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f766e" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="{{ url_for('manifest') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/icon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<title>Messenger</title>
<script>
  (function () {
    var t = localStorage.getItem("theme");
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    if (new URLSearchParams(location.search).has("solo")) document.documentElement.classList.add("solo");
  })();
</script>
{% raw %}
<style>
  :root {
    --bg: #e9f1ef; --panel: #ffffff; --panel2: #f4f8f7; --text: #0f1f1d; --muted: #6a7d7b; --line: #e1e9e7;
    --accent: #0d9488; --accent2: #22c5aa; --grad: linear-gradient(135deg, #0d9488, #19b9a2);
    --in: #ffffff; --in-t: #0f1f1d; --out-t: #ffffff; --chat-bg: #e4eeec; --sel: #e7f5f2; --hover: #f1f7f6;
    --danger: #e5484d; --ok: #22c55e; --field: #f1f6f5; --overlay: rgba(8, 20, 18, .5);
    --shadow: 0 8px 30px -10px rgba(10, 60, 54, .3);
  }
  [data-theme="dark"] {
    --bg: #0a1211; --panel: #101b1a; --panel2: #142120; --text: #e6f1ef; --muted: #86a09c; --line: #1d2d2b;
    --in: #1a2a28; --in-t: #e6f1ef; --chat-bg: #0b1514; --sel: #17302d; --hover: #142423; --field: #172624;
    --overlay: rgba(0, 0, 0, .62); --shadow: 0 8px 30px -10px rgba(0, 0, 0, .8);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg);
    overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  /* ---------- каркас ---------- */
  #app { display: flex; height: 100dvh; max-width: 1600px; margin: 0 auto; background: var(--panel); position: relative; overflow: hidden; }
  #side { width: 372px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; }
  #chat { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; background: var(--chat-bg); }
  .solo #side { display: none; } .solo .back { display: none !important; }

  .ib { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); transition: background .15s, color .15s; flex: none; }
  .ib:hover { background: var(--hover); color: var(--text); } .ib:active { transform: scale(.94); }

  /* ---------- боковая панель ---------- */
  .side-h { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 6px; }
  .side-h h1 { margin: 0 0 0 4px; font-size: 20px; letter-spacing: -.02em; flex: 1; }
  .me { border-radius: 50%; }
  .search { margin: 4px 12px 8px; display: flex; align-items: center; gap: 8px; background: var(--field); border-radius: 12px; padding: 0 12px; height: 40px; color: var(--muted); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 15px; height: 100%; }
  .seg { display: flex; gap: 6px; padding: 0 12px 8px; }
  .seg button { flex: 1; height: 34px; border-radius: 10px; color: var(--muted); font-weight: 600; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .seg button.on { background: var(--sel); color: var(--accent); }
  .seg b { background: var(--accent); color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 5px; }
  #net { background: #f59e0b; color: #fff; text-align: center; font-size: 12.5px; padding: 4px; font-weight: 600; }
  .list { flex: 1; overflow-y: auto; padding: 0 6px calc(8px + env(safe-area-inset-bottom)); min-height: 0; }
  .row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 14px; text-align: left; position: relative; transition: background .12s; }
  .row:hover { background: var(--hover); } .row.on { background: var(--sel); }
  .row .mid { flex: 1; min-width: 0; }
  .l1, .l2 { display: flex; align-items: center; gap: 8px; }
  .nm { font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tm { font-size: 12px; color: var(--muted); flex: none; } .tm.hot { color: var(--accent); font-weight: 600; }
  .pv { flex: 1; min-width: 0; color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv .you { color: var(--text); opacity: .75; }
  .badge { background: var(--grad); color: #fff; font-size: 11.5px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding: 0 6px; flex: none; }
  .empty-l { text-align: center; color: var(--muted); padding: 48px 28px; font-size: 14px; }
  .empty-l .big { font-size: 40px; margin-bottom: 8px; }
  .empty-l b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }

  .av { --s: 46px; width: var(--s); height: var(--s); border-radius: 50%; flex: none; position: relative; display: grid; place-items: center; color: #fff;
        font-weight: 700; font-size: calc(var(--s) * .38); background: linear-gradient(135deg, rgba(255,255,255,.28), rgba(0,0,0,.08)), var(--c, var(--accent)); letter-spacing: .02em; user-select: none; }
  .av.sm { --s: 40px; } .av.xs { --s: 34px; } .av.xl { --s: 88px; }
  .av .dot { position: absolute; right: -1px; bottom: -1px; width: 28%; height: 28%; min-width: 10px; min-height: 10px; background: var(--ok); border-radius: 50%; border: 2.5px solid var(--panel); }
  .av.grp { border-radius: 30%; }

  /* ---------- окно чата ---------- */
  .empty { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
  .empty .logo { width: 96px; height: 96px; border-radius: 28px; margin: 0 auto 16px; box-shadow: 0 18px 40px -16px rgba(13,148,136,.7); }
  .empty h2 { margin: 0 0 6px; color: var(--text); font-size: 20px; }
  .win { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
  .chat-h { display: flex; align-items: center; gap: 6px; padding: calc(8px + env(safe-area-inset-top)) 10px 8px 6px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 3; }
  .back { display: none !important; }
  .who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 2px 4px; cursor: pointer; border-radius: 12px; }
  .wt { min-width: 0; } .wn { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.2; }
  .ws { font-size: 12.5px; color: var(--muted); line-height: 1.3; } .ws.live { color: var(--accent); }
  .msgs { flex: 1; overflow-y: auto; padding: 10px 12px 8px; display: flex; flex-direction: column; min-height: 0; scroll-behavior: smooth;
          background-image: radial-gradient(circle at 20% 15%, rgba(34,197,170,.10), transparent 40%), radial-gradient(circle at 85% 80%, rgba(13,148,136,.09), transparent 45%); }
  .day { align-self: center; margin: 10px 0 6px; }
  .day span { background: var(--panel); color: var(--muted); font-size: 12px; font-weight: 600; padding: 3px 11px; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .m { display: flex; margin-top: 2px; } .m.first { margin-top: 8px; } .m.out { justify-content: flex-end; }
  .b { position: relative; max-width: min(80%, 540px); padding: 6px 10px 6px; border-radius: 16px; background: var(--in); color: var(--in-t); box-shadow: 0 1px 1.5px rgba(0,0,0,.09); overflow-wrap: anywhere; }
  .m.in.first .b { border-top-left-radius: 5px; } .m.out.first .b { border-top-right-radius: 5px; }
  .m.out .b { background: var(--grad); color: var(--out-t); }
  .m.out a { color: #fff; text-decoration: underline; } .m.in a { color: var(--accent); }
  .sn { font-size: 12.5px; font-weight: 700; margin-bottom: 1px; }
  .tx { white-space: pre-wrap; line-height: 1.38; }
  .mt { float: right; margin: 6px 0 -3px 12px; font-size: 11px; opacity: .7; display: inline-flex; align-items: center; gap: 3px; user-select: none; }
  .mt svg { width: 13px; height: 13px; stroke-width: 2.6; }
  .m.media-only .mt { float: none; display: flex; justify-content: flex-end; margin: 3px 0 -2px; }
  .im { display: block; width: 280px; max-width: 100%; max-height: 340px; object-fit: cover; border-radius: 11px; margin: 1px 0 3px; cursor: zoom-in; background: rgba(0,0,0,.08); min-height: 90px; }
  .vd { display: block; width: 300px; max-width: 100%; max-height: 320px; border-radius: 11px; margin: 1px 0 3px; background: #000; }
  .au { display: block; width: 260px; max-width: 100%; height: 40px; margin: 2px 0; }
  .fl { display: flex; align-items: center; gap: 10px; text-decoration: none !important; min-width: 200px; padding: 2px 0; color: inherit !important; }
  .fi { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: rgba(13,148,136,.14); color: var(--accent); flex: none; }
  .m.out .fi { background: rgba(255,255,255,.22); color: #fff; }
  .fn { min-width: 0; flex: 1; display: flex; flex-direction: column; } .fn b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; } .fn small { opacity: .7; font-size: 11.5px; }
  .hello, .loading { margin: auto; color: var(--muted); background: var(--panel); padding: 10px 16px; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .tobottom { position: absolute; right: 14px; bottom: 82px; width: 40px; height: 40px; border-radius: 50%; background: var(--panel); box-shadow: var(--shadow); display: grid; place-items: center; z-index: 4; color: var(--accent); }

  .prev { display: flex; align-items: center; gap: 10px; margin: 0 10px 6px; padding: 8px 10px; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); }
  .prev img { width: 44px; height: 44px; object-fit: cover; border-radius: 9px; } .prev .pi { flex: 1; min-width: 0; font-size: 13.5px; }
  .prev .pi b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .prev small { color: var(--muted); }
  .comp { display: flex; align-items: flex-end; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: transparent; }
  .field { flex: 1; min-width: 0; display: flex; align-items: flex-end; background: var(--panel); border-radius: 22px; padding: 2px 4px; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .field textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: none; resize: none; max-height: 140px; padding: 10px 6px; font-size: 16px; line-height: 1.35; }
  .field .ib { width: 38px; height: 38px; border-radius: 50%; }
  .send { width: 46px; height: 46px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 18px -8px rgba(13,148,136,.9); flex: none; transition: transform .1s, opacity .15s; }
  .send:active { transform: scale(.92); } .send:disabled { opacity: .55; }
  .send svg { transform: translateX(-1px); }
  .emoji { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; padding: 8px; background: var(--panel); border-top: 1px solid var(--line); max-height: 190px; overflow-y: auto; }
  .emoji button { font-size: 24px; height: 40px; border-radius: 10px; } .emoji button:hover { background: var(--hover); }
  .dropzone::after { content: "Отпустите файл, чтобы прикрепить"; position: absolute; inset: 10px; border: 2px dashed var(--accent); border-radius: 18px; background: rgba(13,148,136,.12); display: grid; place-items: center; color: var(--accent); font-weight: 700; z-index: 9; pointer-events: none; }

  /* ---------- оверлеи ---------- */
  .ov { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; z-index: 50; opacity: 0; transition: opacity .18s; backdrop-filter: blur(2px); }
  .ov.show { opacity: 1; }
  .sheet { width: 100%; max-width: 440px; background: var(--panel); border-radius: 22px 22px 0 0; max-height: 90dvh; display: flex; flex-direction: column; transform: translateY(28px); transition: transform .22s cubic-bezier(.2,.8,.2,1); padding-bottom: env(safe-area-inset-bottom); }
  .ov.show .sheet { transform: none; }
  @media (min-width: 640px) { .ov { align-items: center; } .sheet { border-radius: 22px; box-shadow: var(--shadow); } }
  .sh-h { display: flex; align-items: center; padding: 12px 8px 4px 18px; } .sh-h h3 { margin: 0; flex: 1; font-size: 17px; }
  .sh-b { overflow-y: auto; padding: 6px 14px 16px; }
  .sh-b .search { margin: 4px 0 8px; }
  .lab { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 12px 2px 5px; }
  .inp { width: 100%; height: 44px; border-radius: 12px; background: var(--field); border: 1.5px solid transparent; padding: 0 13px; outline: 0; font-size: 16px; }
  .inp:focus { border-color: var(--accent); background: var(--panel); }
  .btn { height: 46px; border-radius: 13px; padding: 0 18px; font-weight: 700; color: #fff; background: var(--grad); box-shadow: 0 10px 20px -10px rgba(13,148,136,.9); width: 100%; margin-top: 14px; }
  .btn.ghost { background: var(--field); color: var(--text); box-shadow: none; } .btn.danger { background: var(--danger); box-shadow: none; } .btn:disabled { opacity: .55; }
  .sw { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0; } .sw button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; background: var(--c); } .sw button.on { border-color: var(--text); }
  .ulist .row { padding: 8px 6px; } .chk { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; flex: none; }
  .row.sel .chk { background: var(--accent); border-color: var(--accent); color: #fff; } .chk svg { width: 14px; height: 14px; stroke-width: 3; }
  .center { text-align: center; } .center .av { margin: 6px auto 10px; } .muted { color: var(--muted); font-size: 13.5px; }
  .hr { height: 1px; background: var(--line); margin: 14px 0 4px; }
  .pill-r { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; }
  .tog { width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; transition: .15s; } .tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .tog.on { background: var(--accent); } .tog.on::after { left: 21px; }

  #ctx { position: fixed; z-index: 60; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); padding: 5px; min-width: 190px; border: 1px solid var(--line); }
  #ctx button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 10px; font-size: 14.5px; } #ctx button:hover { background: var(--hover); } #ctx .danger { color: var(--danger); }
  #lb { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.92); display: grid; place-items: center; } #lb img { max-width: 96vw; max-height: 90dvh; border-radius: 6px; }
  #lb button { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px; color: #fff; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; }
  #toasts { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 90; pointer-events: none; }
  .toast { background: #14201e; color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 14px; box-shadow: var(--shadow); max-width: min(92vw, 420px); animation: tin .22s ease; pointer-events: auto; }
  .toast.err { background: #b42318; } .toast.msg { background: var(--panel); color: var(--text); border: 1px solid var(--line); cursor: pointer; } .toast.out { opacity: 0; transform: translateY(-8px); transition: .3s; }
  @keyframes tin { from { opacity: 0; transform: translateY(-10px); } }

  /* ---------- звонки ---------- */
  #call { position: fixed; inset: 0; z-index: 80; background: radial-gradient(900px 600px at 50% 0, #11544d, #07201d 70%); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: calc(40px + env(safe-area-inset-top)) 20px calc(36px + env(safe-area-inset-bottom)); overflow: hidden; }
  #call video.remote { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #call video.local { position: absolute; right: 14px; top: calc(14px + env(safe-area-inset-top)); width: 104px; height: 148px; object-fit: cover; border-radius: 16px; background: #000; box-shadow: var(--shadow); z-index: 2; transform: scaleX(-1); }
  .c-top { z-index: 2; text-align: center; text-shadow: 0 1px 8px rgba(0,0,0,.5); } .c-top h2 { margin: 12px 0 4px; font-size: 24px; } .c-top p { margin: 0; opacity: .85; }
  .c-top .av { margin: 0 auto; box-shadow: 0 0 0 0 rgba(34,197,170,.5); animation: pulse 2s infinite; } .video-on .c-top .av { display: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 26px rgba(34,197,170,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,170,0); } }
  .c-btns { z-index: 2; display: flex; gap: 18px; } .cb { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,.16); display: grid; place-items: center; color: #fff; backdrop-filter: blur(8px); }
  .cb.off { background: #fff; color: #111; } .cb.end { background: #ef4444; } .cb.end svg { transform: rotate(135deg); } .cb.ok { background: #22c55e; }
  #incoming { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(94vw, 420px); z-index: 85; background: #10201e; color: #fff; border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); animation: tin .25s; border: 1px solid rgba(255,255,255,.1); }
  #incoming .tt { flex: 1; min-width: 0; } #incoming .tt b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #incoming small { opacity: .75; }
  #incoming .cb { width: 46px; height: 46px; }

  /* ---------- мобильная версия: чат открывается отдельным окном ---------- */
  @media (max-width: 820px) {
    #side { width: 100%; border-right: 0; }
    #chat { position: fixed; inset: 0; z-index: 20; transform: translateX(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); }
    body.in-chat #chat { transform: none; }
    .back { display: grid !important; }
    .solo #chat { position: static; transform: none; } .solo .back { display: none !important; }
    .b { max-width: 86%; }
    .tobottom { bottom: 78px; }
  }
  @media (min-width: 821px) { .empty { background-image: radial-gradient(circle at 25% 20%, rgba(34,197,170,.14), transparent 45%), radial-gradient(circle at 80% 85%, rgba(13,148,136,.12), transparent 45%); } }
  /* ---------- выбор сообщений ---------- */
  .selhead { display: none; }
  .win.selecting .chat-h:not(.selhead) { display: none; }
  .win.selecting .selhead { display: flex; }
  .win.selecting .comp, .win.selecting #prev, .win.selecting #emojiPanel { display: none; }
  .win.selecting .msgs { user-select: none; -webkit-user-select: none; }
  .win.selecting .m { cursor: pointer; }
  .m.sel { background: rgba(13, 148, 136, .2); margin-left: -12px; margin-right: -12px; padding: 2px 12px; }
  .m.sel .b { box-shadow: 0 0 0 2px var(--accent); }
  .selhead .ib:disabled { opacity: .35; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
{% endraw %}
</head>
<body>
<div id="app">
  <aside id="side">
    <header class="side-h">
      <button class="me ib" id="meBtn" aria-label="Профиль" style="width:auto;height:auto;padding:0"></button>
      <h1>Messenger</h1>
      <button class="ib" id="logoutBtn" aria-label="Выйти"></button>
      <button class="ib" id="themeBtn" aria-label="Тема"></button>
      <button class="ib" id="newBtn" aria-label="Новый чат"></button>
    </header>
    <div id="net" hidden>Нет соединения. Переподключаюсь…</div>
    <div class="search"><span id="searchIc"></span><input id="q" placeholder="Поиск" autocomplete="off" enterkeyhint="search"></div>
    <nav class="seg">
      <button data-tab="chats" class="on">Чаты <b id="unreadTotal" hidden></b></button>
      <button data-tab="people">Люди</button>
      <button data-tab="calls">Звонки</button>
    </nav>
    <div class="list" id="list"></div>
  </aside>

  <main id="chat">
    <div class="empty" id="empty">
      <div>
        <img class="logo" src="{{ url_for('static', filename='icons/icon-192.png') }}" alt="">
        <h2>Выберите чат</h2>

<script id="boot" type="application/json">{{ {"me": {"id": user_id, "username": username, "display_name": display_name, "bio": bio, "avatar_color": avatar_color}, "contacts": contacts, "chat_id": default_chat_id} | tojson }}</script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous" async onload="window.__ioReady&&window.__ioReady()"></script>
{% raw %}
<script>
(() => {
'use strict';

/* ================= утилиты ================= */
const BOOT = JSON.parse(document.getElementById('boot').textContent);
const ME = BOOT.me;
const SOLO = document.documentElement.classList.contains('solo');
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkify = (t) => esc(t).replace(/(https?:\/\/[^\s<]+)/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const two = (n) => String(n).padStart(2, '0');
const initials = (n) => String(n || '').trim().split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || 'U';
const PALETTE = ['#0d9488', '#0ea5e9', '#8b5cf6', '#f59e0b', '#ef4444', '#10b981', '#ec4899', '#6366f1', '#f97316', '#06b6d4'];
const colorFor = (seed) => PALETTE[[...String(seed || '')].reduce((a, c) => a + c.charCodeAt(0), 0) % PALETTE.length];
const plural = (n, f) => f[n % 10 === 1 && n % 100 !== 11 ? 0 : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 1 : 2];
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const PV = { 'Start a conversation': 'Начните диалог', 'Message deleted': 'Сообщение удалено', '📎 Media message': '📎 Вложение' };
const MAX_BYTES = 16 * 1024 * 1024;
const ALLOWED = new Set('png jpg jpeg gif webp mp4 webm mov mp3 ogg wav m4a pdf txt zip doc docx xls xlsx ppt pptx'.split(' '));
const EMOJI = '😀😁😂🤣😊😍😘😎🤩🥳😉🙂🤔😅😇🥰😋😜🤗😴😢😭😡🤯😱🙏👍👎👏🙌💪👌✌️🤝❤️🧡💛💚💙💜🖤💔🔥✨🎉🎁🌟⭐☀️🌙☕🍕🍔🍰🎵🎮📷📎✅❌⚡💡📌🚀'.match(/\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*/gu) || [];

const ICONS = {
  send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
  clip: '<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
  video: '<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>',
  videooff: '<path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/><line x1="1" y1="1" x2="23" y2="23"/>',
  mic: '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>',
  micoff: '<line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/>',
  back: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  sun: '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
  more: '<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
  file: '<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  edit: '<path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
  smile: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  down: '<polyline points="6 9 12 15 18 9"/>',
  window: '<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/>',
  info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  arrowout: '<line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>',
  arrowin: '<line x1="17" y1="7" x2="7" y2="17"/><polyline points="17 17 7 17 7 7"/>',
};
const ic = (n, s = 20) => `<svg class="i" viewBox="0 0 24 24" width="${s}" height="${s}">${ICONS[n] || ''}</svg>`;

/* ================= состояние ================= */
const S = {
  contacts: BOOT.contacts || [], active: null, convo: null, msgs: new Map(), tab: 'chats', q: '', calls: null,
  typing: {}, socket: null, connected: false, wasDown: false, pending: null, editing: null, sending: false, stick: true, sel: new Set(), selMode: false,
};
const contactById = (id) => S.contacts.find((c) => c.conversation_id === id);

async function api(url, opts = {}) {
  const o = { credentials: 'same-origin', ...opts };
  if (o.json !== undefined) { o.method = o.method || 'POST'; o.headers = { 'Content-Type': 'application/json', ...(o.headers || {}) }; o.body = JSON.stringify(o.json); delete o.json; }
  let r;
  try { r = await fetch(url, o); } catch (e) { throw new Error('Нет соединения с сервером'); }
  if (r.status === 401) { location.href = '/login'; throw new Error('Нужно войти'); }
  let d = {};
  try { d = await r.json(); } catch (e) { /* не JSON */ }
  if (!r.ok) throw new Error(d.error || `Ошибка ${r.status}`);
  return d;
}
function toast(msg, kind = '', onClick) {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  if (onClick) t.addEventListener('click', () => { onClick(); t.remove(); });
  $('#toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 3200); setTimeout(() => t.remove(), 3600);
}

/* ================= время ================= */
const pt = (s) => { if (!s) return null; const d = new Date(String(s).includes('T') ? s : String(s).replace(' ', 'T') + 'Z'); return isNaN(d) ? null : d; };
const hm = (d) => (d ? `${two(d.getHours())}:${two(d.getMinutes())}` : '');
function listTime(s) {
  const d = pt(s); if (!d) return ''; const n = new Date();
  if (d.toDateString() === n.toDateString()) return hm(d);
  if (d.toDateString() === new Date(n - 864e5).toDateString()) return 'Вчера';
  return `${two(d.getDate())}.${two(d.getMonth() + 1)}`;
}
function dayLabel(d) {
  const n = new Date();
  if (d.toDateString() === n.toDateString()) return 'Сегодня';
  if (d.toDateString() === new Date(n - 864e5).toDateString()) return 'Вчера';
  return `${d.getDate()} ${MONTHS[d.getMonth()]}${d.getFullYear() !== n.getFullYear() ? ' ' + d.getFullYear() : ''}`;
}

/* ================= аватары и список ================= */
function avatar(c, cls = '') {
  const dot = c.status === 'online' ? '<i class="dot"></i>' : '';
  return `<div class="av ${cls}${c.type === 'group' ? ' grp' : ''}" style="--c:${esc(c.avatar_color || '#0d9488')}">${esc(c.avatar_text || initials(c.display_name))}${dot}</div>`;
}
const emptyList = (big, title, text) => `<div class="empty-l"><div class="big">${big}</div><b>${title}</b>${text}</div>`;

function renderList() {
  const el = $('#list');
  updateUnread();
  if (S.tab === 'calls') return renderCalls();
  if (S.tab === 'people') return renderPeople();
  const q = S.q.trim().toLowerCase();
  const items = S.contacts.filter((c) => !q || [c.display_name, c.username, c.last_message].some((v) => String(v || '').toLowerCase().includes(q)));
  if (!items.length) {
    el.innerHTML = q ? emptyList('🔍', 'Ничего не найдено', 'Попробуйте другой запрос') : emptyList('💬', 'Пока нет чатов', 'Нажмите «+», чтобы найти человека<br>и начать переписку');
    return;
  }
  el.innerHTML = items.map((c) => {
    const mine = c.last_sender_id === ME.id;
    const raw = PV[c.last_message] || c.last_message || '';
    const pre = c.last_message_time ? (mine ? '<span class="you">Вы: </span>' : '') + esc(raw) : `<i>${esc(raw)}</i>`;
    const unread = c.unread_count > 0 && c.conversation_id !== S.active ? `<b class="badge">${c.unread_count > 99 ? '99+' : c.unread_count}</b>` : '';
    return `<button class="row${c.conversation_id === S.active ? ' on' : ''}" data-open="${c.conversation_id}">${avatar(c)}<div class="mid"><div class="l1"><span class="nm">${esc(c.display_name)}</span><span class="tm${unread ? ' hot' : ''}">${listTime(c.last_message_time)}</span></div><div class="l2"><span class="pv">${pre}</span>${unread}</div></div></button>`;
  }).join('');
}
function updateUnread() {
  const total = S.contacts.reduce((a, c) => a + (c.conversation_id === S.active && !document.hidden ? 0 : c.unread_count || 0), 0);
  const b = $('#unreadTotal'); b.hidden = !total; b.textContent = total > 99 ? '99+' : total;
  document.title = total ? `(${total}) Messenger` : 'Messenger';
}
async function renderCalls() {
  const el = $('#list');
  if (!S.calls) { el.innerHTML = emptyList('⏳', 'Загрузка…', ''); try { S.calls = (await api('/api/calls')).calls; } catch (e) { S.calls = []; toast(e.message, 'err'); } }
  if (S.tab !== 'calls') return;
  if (!S.calls.length) { el.innerHTML = emptyList('📞', 'Звонков пока нет', 'Откройте чат и нажмите на значок телефона'); return; }
  el.innerHTML = S.calls.map((c) => {
    const col = colorFor(c.peer_name);
    const d = pt(c.created_at);
    return `<button class="row" data-callpeer="${c.peer_id}" data-ctype="${esc(c.call_type)}"><div class="av" style="--c:${col}">${esc(initials(c.peer_name))}</div><div class="mid"><div class="l1"><span class="nm">${esc(c.peer_name || c.peer_username)}</span><span class="tm">${d ? listTime(c.created_at) + ' ' + hm(d) : ''}</span></div><div class="l2"><span class="pv" style="display:flex;align-items:center;gap:5px">${ic('arrowout', 14)}Исходящий · ${c.call_type === 'video' ? 'видео' : 'голос'}</span><span style="color:var(--accent)">${ic(c.call_type === 'video' ? 'video' : 'phone', 18)}</span></div></div></button>`;
  }).join('');
}

let peopleSeq = 0;
async function renderPeople() {
  const el = $('#list'), seq = ++peopleSeq;
  try {
    const d = await api('/api/users?q=' + encodeURIComponent(S.q.trim()));
    if (seq !== peopleSeq || S.tab !== 'people') return;
    el.innerHTML = d.users.length ? d.users.map((u) => userRow(u)).join('') : emptyList('🔍', 'Никого не нашли', 'Проверьте имя, логин или номер телефона');
  } catch (e) { if (seq === peopleSeq) el.innerHTML = emptyList('⚠️', 'Ошибка', esc(e.message)); }
}

/* ================= чат ================= */
async function openChat(id, push = true) {
  exitSel(); S.active = id; S.editing = null; clearPending(); closeEmoji();
  document.body.classList.add('in-chat');
  if (push && !SOLO) (document.body.dataset.pushed ? history.replaceState : history.pushState).call(history, { c: id }, '', '#c' + id), document.body.dataset.pushed = '1';
  $('#empty').hidden = true; $('#win').hidden = false;
  $('#input').value = ''; autosize(); updateComposer();
  renderHeader(); renderList();
  if (S.msgs.has(id)) renderMsgs(true); else $('#msgs').innerHTML = '<div class="loading">Загрузка…</div>';
  try {
    const d = await api('/api/chat/' + id);
    if (S.active !== id) return;
    S.msgs.set(id, d.messages); S.convo = d.conversation;
    renderHeader(); renderMsgs(true);
  } catch (e) { toast(e.message, 'err'); }
  const c = contactById(id); if (c) c.unread_count = 0;
  renderList();
  if (matchMedia('(pointer:fine)').matches) $('#input').focus();
}
function closeChatUI() {
  exitSel(); S.active = null; S.convo = null; delete document.body.dataset.pushed;
  document.body.classList.remove('in-chat'); $('#win').hidden = true; $('#empty').hidden = false; renderList();
}
function renderHeader() {
  const c = contactById(S.active); if (!c) return;
  const tp = S.typing[S.active] && S.typing[S.active].until > Date.now() ? S.typing[S.active] : null;
  let st, live = false;
  if (tp) { st = c.type === 'group' ? `${esc(tp.name)} печатает…` : 'печатает…'; live = true; }
  else if (c.type === 'group') { const n = c.member_count || 0; st = `${n} ${plural(n, ['участник', 'участника', 'участников'])}`; }
  else if (c.status === 'online') { st = 'в сети'; live = true; } else st = 'не в сети';
  $('#who').innerHTML = `${avatar(c, 'sm')}<div class="wt"><div class="wn">${esc(c.display_name)}</div><div class="ws${live ? ' live' : ''}">${st}</div></div>`;
  $('#callVoice').hidden = $('#callVideo').hidden = c.type === 'group';
}

function mediaHtml(m) {
  const u = esc(m.attachment_url), n = esc(m.attachment_name || 'файл'), t = m.attachment_type || '';
  if (t.startsWith('image/')) return `<img class="im" src="${u}" alt="${n}" loading="lazy" data-lb="${u}">`;
  if (t.startsWith('video/')) return `<video class="vd" src="${u}" controls playsinline preload="metadata"></video>`;
  if (t.startsWith('audio/')) return `<audio class="au" src="${u}" controls preload="none"></audio>`;
  const ext = (String(m.attachment_name || '').split('.').pop() || '').slice(0, 5).toUpperCase();
  return `<a class="fl" href="${u}" download="${n}" target="_blank" rel="noopener"><span class="fi">${ic('file', 22)}</span><span class="fn"><b>${n}</b><small>${esc(ext)}</small></span>${ic('download', 18)}</a>`;
}
function msgHtml(m, first, group) {
  const out = m.sender_id === ME.id;
  const meta = `<span class="mt">${m.edited_at ? 'изм. ' : ''}${hm(pt(m.created_at))}${out ? ic('check', 13) : ''}</span>`;
  const name = !out && group && first ? `<div class="sn" style="color:${esc(m.sender_color || '#0d9488')}">${esc(m.sender_name || m.sender_username)}</div>` : '';
  const media = m.attachment_url ? mediaHtml(m) : '';
  const text = m.text ? `<div class="tx">${linkify(m.text)}${meta}</div>` : '';
  return `<div class="m ${out ? 'out' : 'in'}${first ? ' first' : ''}${media && !text ? ' media-only' : ''}${S.sel.has(m.id) ? ' sel' : ''}" data-id="${m.id}"><div class="b">${name}${media}${text || meta}</div></div>`;
}
function renderMsgs(bottom = false) {
  const box = $('#msgs'), list = S.msgs.get(S.active) || [];
  const keep = bottom || S.stick;
  const group = (contactById(S.active) || {}).type === 'group';
  let html = '', lastDay = '', prev = null;
  for (const m of list) {
    const d = pt(m.created_at) || new Date();
    if (d.toDateString() !== lastDay) { html += `<div class="day"><span>${dayLabel(d)}</span></div>`; lastDay = d.toDateString(); prev = null; }
    html += msgHtml(m, !prev || prev.sender_id !== m.sender_id, group); prev = m;
  }
  box.innerHTML = html || '<div class="hello">Напишите первое сообщение 👋</div>';
  if (keep) { box.style.scrollBehavior = 'auto'; box.scrollTop = box.scrollHeight; box.style.scrollBehavior = ''; }
}
function addMessage(cid, m, mine) {
  const list = S.msgs.get(cid); if (!list || list.some((x) => x.id === m.id)) return;
  list.push(m);
  if (cid !== S.active) return;
  const box = $('#msgs'), prev = list[list.length - 2];
  if (!prev || (pt(prev.created_at) || new Date()).toDateString() !== (pt(m.created_at) || new Date()).toDateString() || box.querySelector('.hello')) { renderMsgs(mine); }
  else {
    const group = (contactById(cid) || {}).type === 'group';
    box.insertAdjacentHTML('beforeend', msgHtml(m, prev.sender_id !== m.sender_id, group));
    if (mine || S.stick) box.scrollTop = box.scrollHeight;
  }
}

/* ================= отправка ================= */
function autosize() { const t = $('#input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
function updateComposer() {
  $('#sendBtn').innerHTML = S.editing ? ic('check', 22) : ic('send', 22);
  const bar = $('#prev');
  if (S.editing) { bar.hidden = false; bar.innerHTML = `<span style="color:var(--accent)">${ic('edit', 18)}</span><div class="pi"><b>Редактирование</b><small>${esc(S.editing.text.slice(0, 80))}</small></div><button type="button" class="ib" data-cancel-edit>${ic('x')}</button>`; return; }
  if (S.pending) {
    const f = S.pending, isImg = f.type.startsWith('image/');
    bar.hidden = false;
    bar.innerHTML = `${isImg ? `<img src="${URL.createObjectURL(f)}" alt="">` : `<span class="fi" style="width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--sel);color:var(--accent)">${ic('file', 22)}</span>`}<div class="pi"><b>${esc(f.name)}</b><small>${(f.size / 1048576).toFixed(f.size > 1048576 ? 1 : 2)} МБ</small></div><button type="button" class="ib" data-cancel-file>${ic('x')}</button>`;
    return;
  }
  bar.hidden = true; bar.innerHTML = '';
}
function setPending(f) {
  if (!f) return;
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (!ALLOWED.has(ext)) return toast('Этот тип файла не поддерживается', 'err');
  if (f.size > MAX_BYTES) return toast('Файл больше 16 МБ', 'err');
  S.pending = f; updateComposer(); $('#input').focus();
}
function clearPending() { S.pending = null; const f = $('#file'); if (f) f.value = ''; updateComposer(); }

async function send() {
  if (S.sending || !S.active) return;
  const input = $('#input'), text = input.value.trim(), id = S.active;
  S.sending = true; $('#sendBtn').disabled = true;
  try {
    if (S.editing) {
      if (!text) return;
      const d = await api(`/api/messages/${S.editing.id}/edit`, { json: { text } });
      onUpdated(d); S.editing = null; input.value = ''; autosize(); updateComposer();
    } else {
      if (!text && !S.pending) return;
      const fd = new FormData(); fd.append('conversation_id', id); fd.append('text', text); if (S.pending) fd.append('media', S.pending);
      const d = await api('/api/send', { method: 'POST', body: fd });
      input.value = ''; autosize(); clearPending(); closeEmoji();
      addMessage(id, d.message, true);
    }
  } catch (e) { toast(e.message, 'err'); }
  finally { S.sending = false; $('#sendBtn').disabled = false; if (matchMedia('(pointer:fine)').matches) input.focus(); }
}

/* ================= события ================= */
function onUpdated(d) {
  const m = d.message; if (!m) return;
  const list = S.msgs.get(m.conversation_id); if (!list) return;
  const i = list.findIndex((x) => x.id === m.id); if (i >= 0) list[i] = m;
  if (m.conversation_id === S.active) renderMsgs();
}
function onDeleted(d) {
  const list = S.msgs.get(d.conversation_id); if (!list) return;
  S.msgs.set(d.conversation_id, list.filter((x) => x.id !== d.message_id));
  if (d.conversation_id === S.active) renderMsgs();
}
function onTyping(d) {
  S.typing[d.conversation_id] = { name: d.name, until: Date.now() + 3500 };
  if (d.conversation_id === S.active) { renderHeader(); setTimeout(renderHeader, 3600); }
}
function onIncoming(d) {
  const m = d.message, cid = d.conversation_id, mine = m.sender_id === ME.id;
  addMessage(cid, m, mine);
  if (mine) return;
  S.typing[cid] = null;
  if (cid === S.active) renderHeader();
  if (cid === S.active && !document.hidden) api(`/api/chat/${cid}/read`, { method: 'POST' }).catch(() => {});
  else notifyMessage(m, cid);
}
function beep() {
  try { const ac = new (window.AudioContext || window.webkitAudioContext)(), o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = 880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(.12, ac.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .25); o.start(); o.stop(ac.currentTime + .3); setTimeout(() => ac.close(), 500); } catch (e) { /* нет звука */ }
}
function notifyMessage(m, cid) {
  const c = contactById(cid), who = c ? c.display_name : m.sender_name, body = m.text || `📎 ${m.attachment_name || 'Вложение'}`;
  const title = c && c.type === 'group' ? `${who}: ${m.sender_name}` : who;
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    try { const n = new Notification(title, { body, icon: '/static/icons/icon-192.png', tag: 'c' + cid }); n.onclick = () => { window.focus(); openChat(cid); n.close(); }; } catch (e) { /* ignore */ }
  } else if (!document.hidden) toast(`${title}: ${body.slice(0, 80)}`, 'msg', () => openChat(cid));
  beep();
}
async function refreshContacts() { try { S.contacts = (await api('/api/contacts')).contacts; renderList(); renderHeaderIfActive(); } catch (e) { /* сеть */ } }
const renderHeaderIfActive = () => { if (S.active) renderHeader(); };
async function resync() {
  await refreshContacts();
  if (S.active) { try { const d = await api('/api/chat/' + S.active); S.msgs.set(S.active, d.messages); renderMsgs(); } catch (e) { /* ignore */ } }
}
function setNet(down) { $('#net').hidden = !down; }

function initSocket() {
  if (typeof io === 'undefined') { startPolling(); return; }
  const s = io(); S.socket = s;
  s.on('connect', () => { S.connected = true; setNet(false); if (S.wasDown) resync(); S.wasDown = false; });
  s.on('disconnect', () => { S.connected = false; S.wasDown = true; setNet(true); });
  s.on('contacts_updated', (d) => { S.contacts = d.contacts || []; renderList(); renderHeaderIfActive(); });
  s.on('message_received', onIncoming); s.on('message_updated', onUpdated); s.on('message_deleted', onDeleted);
  s.on('typing', onTyping); s.on('call_signal', onSignal);
}
let pollTimer = null;
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    if (document.hidden) return;
    const before = JSON.stringify(S.contacts.map((c) => [c.conversation_id, c.last_message_time, c.unread_count, c.status]));
    await refreshContacts();
    if (S.active) {
      try {
        const d = await api('/api/chat/' + S.active), cur = S.msgs.get(S.active) || [];
        const sig = (a) => a.map((m) => m.id + ':' + (m.edited_at || '')).join(',');
        if (sig(d.messages) !== sig(cur)) { S.msgs.set(S.active, d.messages); renderMsgs(); }
      } catch (e) { /* ignore */ }
    }
  }, 4000);
}
window.__ioReady = () => { if (!S.socket && typeof io !== 'undefined') { clearInterval(pollTimer); pollTimer = null; initSocket(); } };

/* ================= панели (sheets) ================= */
function openSheet(title, html, mount) {
  closeSheet();
  const el = document.createElement('div'); el.id = 'sheet'; el.className = 'ov';
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="sh-h"><h3>${esc(title)}</h3><button class="ib" data-close aria-label="Закрыть">${ic('x')}</button></div><div class="sh-b">${html}</div></div>`;
  document.body.appendChild(el);
  el.addEventListener('click', (e) => { if (e.target === el || e.target.closest('[data-close]')) closeSheet(); });
  if (mount) mount(el);
  requestAnimationFrame(() => el.classList.add('show'));
  return el;
}
function closeSheet() { const s = $('#sheet'); if (s) s.remove(); }
function confirmSheet(text, okLabel, danger = true) {
  return new Promise((res) => {
    const el = openSheet('Подтверждение', `<p style="margin:6px 2px 4px">${esc(text)}</p><button class="btn ${danger ? 'danger' : ''}" data-ok>${esc(okLabel)}</button><button class="btn ghost" data-close style="margin-top:8px">Отмена</button>`);
    let done = false;
    el.addEventListener('click', (e) => { if (e.target.closest('[data-ok]')) { done = true; closeSheet(); res(true); } });
    new MutationObserver((_, ob) => { if (!document.body.contains(el)) { ob.disconnect(); if (!done) res(false); } }).observe(document.body, { childList: true });
  });
}

}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ================= контекстное меню и просмотр ================= */
function showCtx(x, y, items) {
  x = +x || 0; y = +y || 0;   // у контекстного меню с клавиатуры координат может не быть
  const c = $('#ctx');
  c.innerHTML = items.map((i) => `<button data-act="${i.act}" class="${i.danger ? 'danger' : ''}">${ic(i.icon, 18)}<span>${i.label}</span></button>`).join('');
  c.hidden = false;
  const w = c.offsetWidth, h = c.offsetHeight;
  c.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px'; c.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px';
}
const hideCtx = () => { $('#ctx').hidden = true; };
let ctxMsg = null;
function msgMenu(el, x, y) {
  const id = +el.dataset.id, m = (S.msgs.get(S.active) || []).find((v) => v.id === id); if (!m) return;
  ctxMsg = m; const own = m.sender_id === ME.id, items = [];
  if (m.text) items.push({ act: 'copy', icon: 'copy', label: 'Копировать' });
  if (m.attachment_url) items.push({ act: 'open', icon: 'download', label: 'Открыть файл' });
  if (own && !m.attachment_url) items.push({ act: 'edit', icon: 'edit', label: 'Изменить' });
  if (own) items.push({ act: 'del', icon: 'trash', label: 'Удалить', danger: true });
  items.push({ act: 'select', icon: 'check', label: 'Выбрать' });
  showCtx(x, y, items);
}
async function ctxAction(act) {
  const m = ctxMsg; hideCtx(); if (!m) return;
  if (act === 'copy') { try { await navigator.clipboard.writeText(m.text); toast('Скопировано'); } catch (e) { toast('Не удалось скопировать', 'err'); } }
  else if (act === 'select') enterSel(m.id);
  else if (act === 'open') window.open(m.attachment_url, '_blank');
  else if (act === 'edit') { S.editing = { id: m.id, text: m.text }; clearPendingOnly(); $('#input').value = m.text; autosize(); updateComposer(); $('#input').focus(); }
  else if (act === 'del' && await confirmSheet('Удалить это сообщение у всех?', 'Удалить')) {
    try { const d = await api(`/api/messages/${m.id}/delete`, { json: {} }); onDeleted(d); } catch (e) { toast(e.message, 'err'); }
  }
}
function enterSel(id) { S.selMode = true; S.sel = new Set([id]); $('#win').classList.add('selecting'); refreshSel(); }
function exitSel() {
  if (!S.selMode && !S.sel.size) return;
  S.selMode = false; S.sel = new Set(); const w = $('#win'); if (w) w.classList.remove('selecting');
  document.querySelectorAll('#msgs .m.sel').forEach((n) => n.classList.remove('sel'));
}
function toggleSel(id) { S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); if (!S.sel.size) exitSel(); else refreshSel(); }
function selectedMsgs() { const list = S.msgs.get(S.active) || []; return list.filter((m) => S.sel.has(m.id)); }
function refreshSel() {
  document.querySelectorAll('#msgs .m').forEach((n) => n.classList.toggle('sel', S.sel.has(+n.dataset.id)));
  $('#selCount').textContent = `Выбрано: ${S.sel.size}`;

async function selCopy() {
  const txt = selectedMsgs().map((m) => m.text || (m.attachment_name ? `[${m.attachment_name}]` : '')).filter(Boolean).join('\n');
  try { await navigator.clipboard.writeText(txt); toast('Скопировано'); } catch (e) { toast('Не удалось скопировать', 'err'); }
  exitSel();
}
async function selDelete() {
  const msgs = selectedMsgs();
  if (!msgs.length || !msgs.every((m) => m.sender_id === ME.id)) return toast('Удалять можно только свои сообщения', 'err');
  if (!await confirmSheet(`Удалить ${msgs.length} ${plural(msgs.length, ['сообщение', 'сообщения', 'сообщений'])} у всех?`, 'Удалить')) return;
  let fail = 0;
  for (const m of msgs) { try { onDeleted(await api(`/api/messages/${m.id}/delete`, { json: {} })); } catch (e) { fail++; } }
  exitSel(); if (fail) toast(`Не удалось удалить: ${fail}`, 'err');
}
function clearPendingOnly() { S.pending = null; $('#file').value = ''; }
function openLightbox(src) { $('#lb img').src = src; $('#lb').hidden = false; }
function closeEmoji() { $('#emojiPanel').hidden = true; }

/* ================= звонки (WebRTC) ================= */
const CALL = { state: 'idle' };
let ring = null, callTimer = null;
const sig = (kind, extra = {}) => { if (S.socket && CALL.peer) S.socket.emit('call_signal', { to: CALL.peer, kind, call_type: CALL.type, ...extra }); };
async function iceServers() { try { return (await api('/api/ice')).iceServers; } catch (e) { return [{ urls: 'stun:stun.l.google.com:19302' }]; } }
function ringStart() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const beat = () => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 520; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(.14, ac.currentTime + .05); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .55); o.start(); o.stop(ac.currentTime + .6); };
    beat(); ring = { ac, t: setInterval(beat, 1600) };
  } catch (e) { /* ignore */ }
  if (navigator.vibrate) navigator.vibrate([400, 200, 400, 1000, 400, 200, 400]);
}
function ringStop() { if (ring) { clearInterval(ring.t); ring.ac.close().catch(() => {}); ring = null; } if (navigator.vibrate) navigator.vibrate(0); }

async function media(type) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Звонки работают только по HTTPS', 'err'); return null; }
  try { return await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: type === 'video' ? { facingMode: 'user' } : false }); }
  catch (e) { toast('Нет доступа к микрофону или камере', 'err'); return null; }
}
async function makePc() {
  const pc = new RTCPeerConnection({ iceServers: await iceServers() }); CALL.pc = pc; CALL.remote = new MediaStream(); CALL.iceQ = CALL.iceQ || [];
  CALL.stream.getTracks().forEach((t) => pc.addTrack(t, CALL.stream));
  pc.ontrack = (e) => { if (!CALL.remote.getTracks().includes(e.track)) CALL.remote.addTrack(e.track); const v = $('#call video.remote'); if (v) { v.srcObject = CALL.remote; v.play().catch(() => {}); } if (e.track.kind === 'video') $('#call').classList.add('video-on'); };
  pc.onicecandidate = (e) => { if (e.candidate) sig('ice', { payload: e.candidate.toJSON() }); };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') callConnected();
    else if (pc.connectionState === 'failed') { toast('Связь потеряна', 'err'); endCall(true); }

}
async function flushIce() { const q = CALL.iceQ || []; CALL.iceQ = []; for (const c of q) { try { await CALL.pc.addIceCandidate(c); } catch (e) { /* ignore */ } } }

async function startCall(type) {
  const c = contactById(S.active); if (!c || c.type === 'group' || !c.peer_id) return;
  if (CALL.state !== 'idle') return toast('Звонок уже идёт');
  if (!S.socket || !S.connected) return toast('Нет соединения в реальном времени', 'err');
  const stream = await media(type); if (!stream) return;
  Object.assign(CALL, { state: 'calling', type, peer: c.peer_id, name: c.display_name, color: c.avatar_color, text: c.avatar_text, dir: 'out', stream, iceQ: [] });
  try {
    await makePc();
    const offer = await CALL.pc.createOffer(); await CALL.pc.setLocalDescription(offer);
    sig('offer', { payload: { type: offer.type, sdp: offer.sdp } });
  } catch (e) { toast('Не удалось начать звонок', 'err'); return cleanupCall(); }
  api('/api/call/' + type, { json: { recipient_id: c.peer_id, conversation_id: c.conversation_id } }).then(() => { S.calls = null; }).catch(() => {});
  showCall('Вызов…'); CALL.timeout = setTimeout(() => { if (CALL.state === 'calling') { toast('Нет ответа'); endCall(true); } }, 45000);
}
function showIncoming() {
  const el = $('#incoming');
  el.innerHTML = `<div class="av" style="--c:${esc(CALL.color || '#0d9488')}">${esc(CALL.text)}</div><div class="tt"><b>${esc(CALL.name)}</b><small>${CALL.type === 'video' ? 'Видеозвонок' : 'Голосовой звонок'}…</small></div><button class="cb end" data-act-call="decline" aria-label="Отклонить">${ic('phone', 22)}</button><button class="cb ok" data-act-call="accept" aria-label="Ответить">${ic(CALL.type === 'video' ? 'video' : 'phone', 22)}</button>`;
  el.hidden = false;
}
async function acceptCall() {
  if (CALL.state !== 'ringing') return;
  ringStop(); clearTimeout(CALL.timeout); $('#incoming').hidden = true;
  const stream = await media(CALL.type); if (!stream) return declineCall();
  CALL.stream = stream; CALL.state = 'connecting';
  try {
    await makePc(); await CALL.pc.setRemoteDescription(CALL.offer); await flushIce();
    const ans = await CALL.pc.createAnswer(); await CALL.pc.setLocalDescription(ans);
    sig('answer', { payload: { type: ans.type, sdp: ans.sdp } });
  } catch (e) { toast('Не удалось ответить', 'err'); return endCall(true); }
  showCall('Соединение…');
}
function declineCall() { sig('reject'); cleanupCall(); }
function endCall(notify) { if (notify) sig('end'); cleanupCall(); }
function showCall(status) {
  const el = $('#call'); const video = CALL.type === 'video';
  el.className = video ? 'video-on-pending' : ''; el.classList.toggle('video-on', false);
  el.innerHTML = `${video ? '<video class="remote" autoplay playsinline></video><video class="local" autoplay playsinline muted></video>' : '<video class="remote" autoplay playsinline style="display:none"></video>'}<div class="c-top"><div class="av xl" style="--c:${esc(CALL.color || '#0d9488')}">${esc(CALL.text)}</div><h2>${esc(CALL.name)}</h2><p id="cstat">${esc(status)}</p></div><div class="c-btns"><button class="cb" data-act-call="mute" id="cmute" aria-label="Микрофон">${ic('mic', 24)}</button>${video ? `<button class="cb" data-act-call="cam" id="ccam" aria-label="Камера">${ic('video', 24)}</button>` : ''}<button class="cb end" data-act-call="end" aria-label="Завершить">${ic('phone', 26)}</button></div>`;
  el.hidden = false;
  const lv = $('#call video.local'); if (lv && CALL.stream) lv.srcObject = CALL.stream;
  const rv = $('#call video.remote'); if (rv && CALL.remote) rv.srcObject = CALL.remote;
}
function callConnected() {
  if (CALL.state === 'connected') return;
  CALL.state = 'connected'; clearTimeout(CALL.timeout); const t0 = Date.now();
  const tick = () => { const s = Math.floor((Date.now() - t0) / 1000), el = $('#cstat'); if (el) el.textContent = `${two(Math.floor(s / 60))}:${two(s % 60)}`; };
  tick(); callTimer = setInterval(tick, 1000);
}
function cleanupCall() {
  ringStop(); clearTimeout(CALL.timeout); clearInterval(callTimer); callTimer = null;
  if (CALL.stream) CALL.stream.getTracks().forEach((t) => t.stop());
  if (CALL.pc) { try { CALL.pc.close(); } catch (e) { /* ignore */ } }
  for (const k of Object.keys(CALL)) delete CALL[k];
  CALL.state = 'idle'; $('#call').hidden = true; $('#call').innerHTML = ''; $('#incoming').hidden = true;
}
async function onSignal(d) {
  const k = d.kind;
  if (k === 'offer') {
    if (CALL.state !== 'idle') { S.socket.emit('call_signal', { to: d.from, kind: 'reject' }); return; }
    Object.assign(CALL, { state: 'ringing', type: d.call_type === 'video' ? 'video' : 'voice', peer: d.from, name: d.from_name, color: d.from_color, text: initials(d.from_name), offer: d.payload, dir: 'in', iceQ: [] });
    showIncoming(); ringStart();
    if (document.hidden && 'Notification' in window && Notification.permission === 'granted') { try { new Notification(`${d.from_name} звонит`, { body: CALL.type === 'video' ? 'Видеозвонок' : 'Голосовой звонок', icon: '/static/icons/icon-192.png', requireInteraction: true }); } catch (e) { /* ignore */ } }
    CALL.timeout = setTimeout(() => { if (CALL.state === 'ringing') declineCall(); }, 45000);
    return;
  }
  if (d.from !== CALL.peer) return;
  if (k === 'answer' && CALL.pc) { try { await CALL.pc.setRemoteDescription(d.payload); await flushIce(); const s = $('#cstat'); if (s && CALL.state !== 'connected') s.textContent = 'Соединение…'; } catch (e) { toast('Ошибка соединения', 'err'); endCall(true); } }
  else if (k === 'ice') { if (CALL.pc && CALL.pc.remoteDescription) { try { await CALL.pc.addIceCandidate(d.payload); } catch (e) { /* ignore */ } } else (CALL.iceQ = CALL.iceQ || []).push(d.payload); }
  else if (['end', 'reject', 'unavailable'].includes(k)) { toast(k === 'reject' ? 'Вызов отклонён' : k === 'unavailable' ? 'Абонент не в сети' : 'Звонок завершён'); cleanupCall(); }
}
function callAction(a) {
  if (a === 'accept') acceptCall();
  else if (a === 'decline') declineCall();
  else if (a === 'end') endCall(true);
  else if (a === 'mute' && CALL.stream) { const t = CALL.stream.getAudioTracks()[0]; if (t) { t.enabled = !t.enabled; const b = $('#cmute'); b.classList.toggle('off', !t.enabled); b.innerHTML = ic(t.enabled ? 'mic' : 'micoff', 24); } }
  else if (a === 'cam' && CALL.stream) { const t = CALL.stream.getVideoTracks()[0]; if (t) { t.enabled = !t.enabled; const b = $('#ccam'); b.classList.toggle('off', !t.enabled); b.innerHTML = ic(t.enabled ? 'video' : 'videooff', 24); } }
}

/* ================= оформление и навигация ================= */
function renderMe() {
  $('#meBtn').innerHTML = `<div class="av xs" style="--c:${esc(ME.avatar_color || '#0d9488')}">${esc(initials(ME.display_name))}</div>`;
}
function setTheme(t) {
  document.documentElement.dataset.theme = t; localStorage.setItem('theme', t);
  $('#themeBtn').innerHTML = ic(t === 'dark' ? 'sun' : 'moon');
  $('#themeColor').content = t === 'dark' ? '#0f1a19' : '#0f766e';
}
function syncTabs() { document.querySelectorAll('.seg button').forEach((b) => b.classList.toggle('on', b.dataset.tab === S.tab)); renderList(); }

function init() {
  document.body.classList.toggle('solo', SOLO);
  $('#searchIc').innerHTML = ic('search', 18);
  $('#newBtn').innerHTML = ic('plus', 22); $('#backBtn').innerHTML = ic('back', 22);
  $('#callVoice').innerHTML = ic('phone'); $('#callVideo').innerHTML = ic('video'); $('#moreBtn').innerHTML = ic('more');
  $('#emojiBtn').innerHTML = ic('smile', 22); $('#attachBtn').innerHTML = ic('clip', 22); $('#toBottom').innerHTML = ic('down', 22); $('#lbX').innerHTML = ic('x', 22);
  $('#emojiPanel').innerHTML = EMOJI.map((e) => `<button type="button" data-emoji="${e}">${e}</button>`).join('');
  $('#logoutBtn').innerHTML = ic('logout'); $('#selCancel').innerHTML = ic('x', 22); $('#selCopy').innerHTML = ic('copy'); $('#selDel').innerHTML = ic('trash');
  $('#logoutBtn').addEventListener('click', async () => { if (await confirmSheet('Выйти из аккаунта?', 'Выйти', false)) location.href = '/logout'; });
  $('#selCancel').addEventListener('click', exitSel); $('#selCopy').addEventListener('click', selCopy); $('#selDel').addEventListener('click', selDelete);
  renderMe(); setTheme(document.documentElement.dataset.theme); updateComposer(); renderList();

  /* клики */
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (!t.closest('#ctx')) hideCtx();
    let b;
    if ((b = t.closest('[data-open]'))) openChat(+b.dataset.open);
    else if ((b = t.closest('[data-callpeer]'))) callFromHistory(+b.dataset.callpeer, b.dataset.ctype);
    else if ((b = t.closest('[data-tab]'))) { S.tab = b.dataset.tab; syncTabs(); }
    else if ((b = t.closest('#list [data-user]'))) startChatWith(+b.dataset.user);
    else if ((b = t.closest('[data-lb]'))) openLightbox(b.dataset.lb);
    else if ((b = t.closest('[data-emoji]'))) { const i = $('#input'), s = i.selectionStart ?? i.value.length; i.value = i.value.slice(0, s) + b.dataset.emoji + i.value.slice(i.selectionEnd ?? s); i.selectionStart = i.selectionEnd = s + b.dataset.emoji.length; autosize(); i.focus(); }
    else if ((b = t.closest('[data-act]')) && b.closest('#ctx')) ctxAction(b.dataset.act);
    else if ((b = t.closest('[data-act-call]'))) callAction(b.dataset.actCall);
    else if (t.closest('[data-cancel-file]')) clearPending();
    else if (t.closest('[data-cancel-edit]')) { S.editing = null; $('#input').value = ''; autosize(); updateComposer(); }
  });
  $('#lb').addEventListener('click', () => { $('#lb').hidden = true; });
  $('#meBtn').addEventListener('click', profileSheet);
  $('#themeBtn').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
  $('#newBtn').addEventListener('click', newChatSheet);
  const peopleSearch = debounce(() => renderList(), 250);
  $('#q').addEventListener('input', (e) => { S.q = e.target.value; if (S.tab === 'calls') { S.tab = 'chats'; syncTabs(); } else if (S.tab === 'people') peopleSearch(); else renderList(); });
  $('#backBtn').addEventListener('click', () => { if (history.state && history.state.c) history.back(); else closeChatUI(); });
  $('#who').addEventListener('click', infoSheet);
  $('#callVoice').addEventListener('click', () => startCall('voice'));
  $('#callVideo').addEventListener('click', () => startCall('video'));
  $('#moreBtn').addEventListener('click', (e) => {
    const r = e.currentTarget.getBoundingClientRect(); const items = [{ act: 'm-info', icon: 'info', label: 'Информация' }];
    if (!SOLO && matchMedia('(min-width: 821px)').matches) items.push({ act: 'm-win', icon: 'window', label: 'Открыть в отдельном окне' });
    if (!SOLO && matchMedia('(min-width: 821px)').matches) items.push({ act: 'm-close', icon: 'x', label: 'Закрыть чат' });
    showCtx(r.right - 210, r.bottom + 4, items); e.stopPropagation();
  });
  $('#ctx').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
    if (a === 'm-info') { hideCtx(); infoSheet(); }
    else if (a === 'm-win') { hideCtx(); window.open(`/messenger?solo=1&chat_id=${S.active}`, `chat${S.active}`, 'width=460,height=760,noopener'); }
    else if (a === 'm-close') { hideCtx(); history.state && history.state.c ? history.back() : closeChatUI(); }
  }, true);

  /* поле ввода */
  const input = $('#input'); let lastTyping = 0;
  input.addEventListener('input', () => { autosize(); const n = Date.now(); if (S.socket && S.connected && S.active && n - lastTyping > 2500) { lastTyping = n; S.socket.emit('typing', { conversation_id: S.active }); } });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(); } if (e.key === 'Escape' && S.editing) { S.editing = null; input.value = ''; autosize(); updateComposer(); } });
  input.addEventListener('paste', (e) => { const f = [...(e.clipboardData?.files || [])][0]; if (f) { e.preventDefault(); setPending(f); } });
  $('#comp').addEventListener('submit', (e) => { e.preventDefault(); send(); });
  $('#attachBtn').addEventListener('click', () => $('#file').click());
  $('#file').addEventListener('change', (e) => setPending(e.target.files[0]));
  $('#emojiBtn').addEventListener('click', () => { const p = $('#emojiPanel'); p.hidden = !p.hidden; });
  const win = $('#win');
  ['dragenter', 'dragover'].forEach((n) => win.addEventListener(n, (e) => { e.preventDefault(); win.classList.add('dropzone'); }));
  ['dragleave', 'drop'].forEach((n) => win.addEventListener(n, (e) => { e.preventDefault(); if (n === 'drop' || e.target === win) win.classList.remove('dropzone'); }));
  win.addEventListener('drop', (e) => setPending(e.dataTransfer.files[0]));

  /* сообщения: прокрутка, меню, долгое нажатие */
  const box = $('#msgs');
  box.addEventListener('click', (e) => {   // в режиме выбора клик отмечает сообщение; Ctrl/Cmd+клик включает режим
    const m = e.target.closest('.m'); if (!m) return;
    if (S.selMode || e.ctrlKey || e.metaKey) { e.preventDefault(); e.stopPropagation(); S.selMode ? toggleSel(+m.dataset.id) : enterSel(+m.dataset.id); }
  }, true);
  box.addEventListener('scroll', () => { S.stick = box.scrollHeight - box.scrollTop - box.clientHeight < 120; $('#toBottom').hidden = S.stick; });
  box.addEventListener('load', (e) => { if (e.target.tagName === 'IMG' && S.stick) box.scrollTop = box.scrollHeight; }, true);
  $('#toBottom').addEventListener('click', () => { box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' }); });
  box.addEventListener('contextmenu', (e) => { const m = e.target.closest('.m'); if (!m || e.target.closest('a,video,audio')) return; e.preventDefault(); msgMenu(m, e.clientX, e.clientY); });
  let lp = null;
  box.addEventListener('touchstart', (e) => { const m = e.target.closest('.m'); if (!m || e.target.closest('a,video,audio')) return; const t = e.touches[0]; lp = setTimeout(() => { lp = null; if (navigator.vibrate) navigator.vibrate(12); msgMenu(m, t.clientX, t.clientY); }, 480); }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach((n) => box.addEventListener(n, () => { clearTimeout(lp); }, { passive: true }));

  /* история браузера (кнопка «назад» на телефоне закрывает чат) */
  window.addEventListener('popstate', () => { const m = /^#c(\d+)$/.exec(location.hash); if (m) openChat(+m[1], false); else closeChatUI(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('#sheet')) closeSheet(); else if (!$('#lb').hidden) $('#lb').hidden = true; else if (S.selMode) exitSel(); else hideCtx(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { updateUnread(); if (S.active) api(`/api/chat/${S.active}/read`, { method: 'POST' }).catch(() => {}); } });
  window.addEventListener('online', () => { setNet(false); resync(); }); window.addEventListener('offline', () => setNet(true));

  /* начальный чат */
  const hash = /^#c(\d+)$/.exec(location.hash);
  const start = BOOT.chat_id || (hash ? +hash[1] : null);
  if (start && !SOLO) history.replaceState({ c: start }, '', '#c' + start);
  if (start) openChat(start, false);
  initSocket();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) navigator.serviceWorker.register('/sw.js').catch(() => {});
}
async function callFromHistory(peerId, type) {
  let c = S.contacts.find((x) => x.peer_id === peerId);
  if (!c) { await startChatWith(peerId); c = S.contacts.find((x) => x.peer_id === peerId); }
  else await openChat(c.conversation_id);
  if (c) startCall(type === 'video' ? 'video' : 'voice');
}
init();
})();
</script>
